name: XDrop Multi-Arch Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # 1. Go Controller —— x86_64 / aarch64
  #    纯 Go,CGO_ENABLED=0,静态二进制
  # ============================================================
  build-controller:
    name: Build Controller (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            runner: ubuntu-latest
          - arch: arm64
            goarch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache: true
          cache-dependency-path: controller/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: controller/web/package-lock.json

      - name: Build Controller (via project script)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          chmod +x scripts/build-controller.sh
          ./scripts/build-controller.sh

      - name: Verify architecture
        run: |
          BIN="controller/xdrop-controller"
          test -f "$BIN" || { echo "::error::$BIN not found"; ls -la controller/; exit 1; }
          file "$BIN"
          case "${{ matrix.goarch }}" in
            amd64) file "$BIN" | grep -q "x86-64"  || { echo "::error::expected x86-64";  exit 1; } ;;
            arm64) file "$BIN" | grep -q "aarch64" || { echo "::error::expected aarch64"; exit 1; } ;;
          esac

      - name: Rename output
        run: |
          mkdir -p dist
          cp controller/xdrop-controller dist/xdrop-controller-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdrop-controller-linux-${{ matrix.arch }}
          path: dist/xdrop-controller-linux-${{ matrix.arch }}

  # ============================================================
  # 2. BPF 对象 —— 架构无关,只编译一次
  #    产出 xdrop_main.elf + xdrop_gate.elf
  # ============================================================
  build-bpf:
    name: Build BPF Objects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libbpf-dev libelf-dev pkg-config \
            linux-libc-dev build-essential

      - name: Install bpftool (static, kernel-independent)
        run: |
          BPFTOOL_VERSION=v7.5.0
          curl -sL "https://github.com/libbpf/bpftool/releases/download/${BPFTOOL_VERSION}/bpftool-${BPFTOOL_VERSION}-amd64.tar.gz" \
            | tar -xz
          sudo mv bpftool /usr/local/bin/bpftool
          sudo chmod +x /usr/local/bin/bpftool
          bpftool version

      - name: Generate vmlinux.h
        run: |
          test -f /sys/kernel/btf/vmlinux || { echo "::error::no BTF on runner"; exit 1; }
          bpftool btf dump file /sys/kernel/btf/vmlinux format c > node/bpf/vmlinux.h

      - name: Build BPF (via project script)
        run: |
          chmod +x scripts/build-node.sh
          ./scripts/build-node.sh bpf

      - name: Verify ELFs
        run: |
          for f in node/bpf/xdrop_main.elf node/bpf/xdrop_gate.elf; do
            test -f "$f" || { echo "::error::$f missing"; exit 1; }
            file "$f"
          done

      - name: Upload BPF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xdrop-bpf-elf
          path: |
            node/bpf/xdrop_main.elf
            node/bpf/xdrop_gate.elf
          if-no-files-found: error

  # ============================================================
  # 3. Go Agent —— x86_64 / aarch64,静态编译
  #    依赖 BPF 作业的 ELF,与 ELF 一起打包
  # ============================================================
  build-agent:
    name: Build Agent (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [build-bpf]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            runner: ubuntu-latest
          - arch: arm64
            goarch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Download BPF ELFs
        uses: actions/download-artifact@v4
        with:
          name: xdrop-bpf-elf
          path: node/bpf

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache: true
          cache-dependency-path: node/agent/go.sum

      - name: Build Agent (via project script)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"          # cilium/ebpf —— 纯 Go,静态
        run: |
          chmod +x scripts/build-node.sh
          ./scripts/build-node.sh agent

      - name: Verify architecture
        run: |
          BIN="node/xdrop-agent"
          test -f "$BIN" || { echo "::error::$BIN not found"; ls -la node/; exit 1; }
          file "$BIN"
          case "${{ matrix.goarch }}" in
            amd64) file "$BIN" | grep -q "x86-64"  || { echo "::error::expected x86-64";  exit 1; } ;;
            arm64) file "$BIN" | grep -q "aarch64" || { echo "::error::expected aarch64"; exit 1; } ;;
          esac

      - name: Stage bundle (agent + ELFs)
        run: |
          mkdir -p dist/bundle
          cp node/xdrop-agent              dist/bundle/xdrop-agent
          cp node/bpf/xdrop_main.elf       dist/bundle/
          cp node/bpf/xdrop_gate.elf       dist/bundle/
          # 打包成 tar,保证 ELF 与 agent 一起分发
          tar -C dist/bundle -czf \
            dist/xdrop-node-linux-${{ matrix.arch }}.tar.gz \
            xdrop-agent xdrop_main.elf xdrop_gate.elf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdrop-node-linux-${{ matrix.arch }}
          path: dist/xdrop-node-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # ============================================================
  # 4. 汇总
  # ============================================================
  release-artifacts:
    name: Collect All Artifacts
    needs: [build-controller, build-agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: List artifacts
        run: find all-artifacts -type f -exec ls -lh {} \;

      - name: Upload combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: xdrop-all-binaries
          path: all-artifacts
