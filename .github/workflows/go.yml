name: Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Controller — 四象限（mattn/go-sqlite3 需 CGO）
  #    在对应架构 runner 原生编译，musl 用 musl-gcc 静态链接
  # ─────────────────────────────────────────────────────────────
  controller:
    name: Controller (${{ matrix.arch }}-${{ matrix.libc }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64
          - arch: amd64
            goarch: amd64
            libc: glibc
            runner: ubuntu-22.04
            cc: gcc
            static_flags: ''
          - arch: amd64
            goarch: amd64
            libc: musl
            runner: ubuntu-22.04
            cc: musl-gcc
            static_flags: "-linkmode external -extldflags '-static'"

          # arm64
          - arch: arm64
            goarch: arm64
            libc: glibc
            runner: ubuntu-22.04-arm
            cc: gcc
            static_flags: ''
          - arch: arm64
            goarch: arm64
            libc: musl
            runner: ubuntu-22.04-arm
            cc: musl-gcc
            static_flags: "-linkmode external -extldflags '-static'"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: controller/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: controller/web/package-lock.json

      - name: Install CGO build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev musl-tools

      - name: Build frontend
        working-directory: controller/web
        run: |
          npm ci
          npm run build

      # musl 静态链接需要显式指定 -static，glibc 不需要
      - name: Build controller binary
        working-directory: controller
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
          CGO_LDFLAGS: ${{ matrix.libc == 'musl' && '-static' || '' }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME:-dev} ${{ matrix.static_flags }}" \
            -o ../dist/xdrop-controller-linux-${{ matrix.arch }}-${{ matrix.libc }} \
            ./cmd/controller

      # 校验 musl 产物确实是静态链接（防止误出 glibc 版）
      - name: Verify linkage
        if: matrix.libc == 'musl'
        run: |
          file dist/xdrop-controller-linux-${{ matrix.arch }}-musl
          if ! file dist/xdrop-controller-linux-${{ matrix.arch }}-musl | grep -q "statically linked"; then
            echo "ERROR: musl build is not statically linked"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: controller-${{ matrix.arch }}-${{ matrix.libc }}
          path: dist/xdrop-controller-*
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 2. Node Agent — 四象限（BPF + Go CGO）
  # ─────────────────────────────────────────────────────────────
  node-agent:
    name: Node Agent (${{ matrix.arch }}-${{ matrix.libc }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64
          - arch: amd64
            goarch: amd64
            libc: glibc
            runner: ubuntu-22.04
            cc: gcc
            static_flags: ''
          - arch: amd64
            goarch: amd64
            libc: musl
            runner: ubuntu-22.04
            cc: musl-gcc
            static_flags: "-linkmode external -extldflags '-static'"

          # arm64
          - arch: arm64
            goarch: arm64
            libc: glibc
            runner: ubuntu-22.04-arm
            cc: gcc
            static_flags: ''
          - arch: arm64
            goarch: arm64
            libc: musl
            runner: ubuntu-22.04-arm
            cc: musl-gcc
            static_flags: "-linkmode external -extldflags '-static'"

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm make bpftool \
            linux-libc-dev libbpf-dev \
            libelf-dev zlib1g-dev \
            gcc musl-tools

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: node/agent/go.sum

      # ── 生成 vmlinux.h（仓库里没有） ──
      - name: Generate vmlinux.h
        working-directory: node/bpf
        run: |
          if [ -f vmlinux.h ]; then
            echo "vmlinux.h already present, skip"
          else
            if bpftool btf dump file /sys/kernel/btf/vmlinux format c > vmlinux.h 2>/dev/null; then
              echo "Generated from runner kernel BTF"
            else
              echo "Fallback: downloading from libbpf/vmlinux.h"
              curl -fsSL \
                https://raw.githubusercontent.com/libbpf/vmlinux.h/main/vmlinux.h \
                -o vmlinux.h
            fi
          fi
          head -5 vmlinux.h

      # ── 编译 BPF 程序 ──
      # 注意：node/Makefile 是 `make -C bpf`，不暴露 CC/ARCH。
      # 通过 env 传 MAKEFLAGS，需 bpf/Makefile 里用 $(CC) / $(ARCH) 才能覆盖。
      - name: Build BPF objects
        working-directory: node
        env:
          CC: clang
          ARCH: ${{ matrix.arch == 'arm64' && 'arm64' || 'x86' }}
        run: make bpf

      # ── 编译 Go agent ──
      - name: Build node agent
        working-directory: node/agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
          CGO_LDFLAGS: ${{ matrix.libc == 'musl' && '-static' || '' }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME:-dev} ${{ matrix.static_flags }}" \
            -o ../../dist/xdrop-agent-linux-${{ matrix.arch }}-${{ matrix.libc }} \
            .

      - name: Verify linkage
        if: matrix.libc == 'musl'
        run: |
          file dist/xdrop-agent-linux-${{ matrix.arch }}-musl
          if ! file dist/xdrop-agent-linux-${{ matrix.arch }}-musl | grep -q "statically linked"; then
            echo "ERROR: musl build is not statically linked"
            exit 1
          fi

      # BPF .elf 按架构打包（.elf 与 libc 无关，去重）
      - name: Package artifacts
        run: |
          ARCH_DIR=${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}
          mkdir -p dist/bpf-${ARCH_DIR}
          cp node/bpf/*.elf dist/bpf-${ARCH_DIR}/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: node-agent-${{ matrix.arch }}-${{ matrix.libc }}
          path: dist/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 3. 发布 Release（latest）
  # ─────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [controller, node-agent]
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: find artifacts/ -type f -exec ls -lh {} \;

      - name: Generate checksums
        working-directory: artifacts
        run: |
          find . -type f ! -name 'checksums.txt' -exec sha256sum {} \; \
            | sed 's|\./||' | sort -k2 > checksums.txt
          cat checksums.txt

      - name: Compute release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            artifacts/xdrop-controller-*
            artifacts/xdrop-agent-*
            artifacts/bpf-*/**
            artifacts/checksums.txt
          fail_on_unmatched_files: false
