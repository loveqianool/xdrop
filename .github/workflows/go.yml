name: Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: 'stable'
  NODE_VERSION: 'lts/*'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/xdrop
  ALPINE_IMAGE: alpine:latest

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Controller — 四象限二进制
  # ─────────────────────────────────────────────────────────────
  controller:
    name: Controller (${{ matrix.arch }}-${{ matrix.libc }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            libc: glibc
            runner: ubuntu-latest
            cc: gcc
            static_flags: ''
          - arch: amd64
            goarch: amd64
            libc: musl
            runner: ubuntu-latest
            cc: musl-gcc
            static_flags: "-linkmode external -extldflags '-static'"
          - arch: arm64
            goarch: arm64
            libc: glibc
            runner: ubuntu-24.04-arm
            cc: gcc
            static_flags: ''
          - arch: arm64
            goarch: arm64
            libc: musl
            runner: ubuntu-24.04-arm
            cc: musl-gcc
            static_flags: "-linkmode external -extldflags '-static'"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: controller/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: controller/web/package-lock.json

      - name: Install CGO build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev musl-tools

      - name: Build frontend
        working-directory: controller/web
        run: |
          npm ci
          npm run build

      - name: Build controller binary
        working-directory: controller
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
          CGO_LDFLAGS: ${{ matrix.libc == 'musl' && '-static' || '' }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME:-dev} ${{ matrix.static_flags }}" \
            -o ../dist/xdrop-controller-linux-${{ matrix.arch }}-${{ matrix.libc }} \
            ./cmd/controller
          chmod +x ../dist/xdrop-controller-linux-${{ matrix.arch }}-${{ matrix.libc }}

      - name: Verify linkage (musl static)
        if: matrix.libc == 'musl'
        run: |
          BIN=dist/xdrop-controller-linux-${{ matrix.arch }}-musl
          file "$BIN"
          if ldd "$BIN" 2>&1 | grep -q "not a dynamic executable"; then
            echo "OK: $BIN is statically linked"
          elif ldd "$BIN" 2>&1 | grep -qi "statically linked"; then
            echo "OK: $BIN is statically linked"
          else
            echo "ERROR: $BIN is NOT statically linked"
            ldd "$BIN" || true
            exit 1
          fi

      - name: Verify executable bit
        run: |
          if [ ! -x dist/xdrop-controller-linux-${{ matrix.arch }}-${{ matrix.libc }} ]; then
            echo "ERROR: binary is not executable"
            exit 1
          fi
          ls -l dist/xdrop-controller-linux-${{ matrix.arch }}-${{ matrix.libc }}

      - uses: actions/upload-artifact@v4
        with:
          name: controller-${{ matrix.arch }}-${{ matrix.libc }}
          path: dist/xdrop-controller-linux-${{ matrix.arch }}-${{ matrix.libc }}
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 2. Node Agent — BPF 在 Alpine 容器内编译 + 四象限二进制
  # ─────────────────────────────────────────────────────────────
  node-agent:
    name: Node Agent (${{ matrix.arch }}-${{ matrix.libc }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            libc: glibc
            runner: ubuntu-latest
            cc: gcc
            static_flags: ''
          - arch: amd64
            goarch: amd64
            libc: musl
            runner: ubuntu-latest
            cc: musl-gcc
            static_flags: "-linkmode external -extldflags '-static'"
          - arch: arm64
            goarch: arm64
            libc: glibc
            runner: ubuntu-24.04-arm
            cc: gcc
            static_flags: ''
          - arch: arm64
            goarch: arm64
            libc: musl
            runner: ubuntu-24.04-arm
            cc: musl-gcc
            static_flags: "-linkmode external -extldflags '-static'"

    steps:
      - uses: actions/checkout@v4
      - name: Install CGO build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev musl-tools
      # ── BPF 编译：不走 make，直接 clang，避免改 Makefile ──
      - name: Build BPF objects in Alpine container
        env:
          KERNEL_ARCH: ${{ matrix.arch == 'arm64' && 'arm64' || 'x86' }}
        run: |
          set -euo pipefail
          echo "Building BPF for KERNEL_ARCH=${KERNEL_ARCH} on platform linux/${{ matrix.arch }}"
          docker run --rm \
            --platform "linux/${{ matrix.arch }}" \
            -e ARCH="${KERNEL_ARCH}" \
            -v "${{ github.workspace }}:/src" \
            -w /src/node/bpf \
            "${{ env.ALPINE_IMAGE }}" \
            sh -c '
              set -euo pipefail
              apk add --no-cache \
                clang llvm make \
                linux-headers libbpf-dev \
                elfutils-dev zlib-dev \
                bpftool file

              echo "ARCH inside container = ${ARCH}"

              CFLAGS="-O2 -g -Wall -target bpf -D__BPF__ -I./headers -D__TARGET_ARCH_${ARCH}"

              echo "clang $CFLAGS -c xdrop_main.c -o xdrop_main.elf"
              clang $CFLAGS -c xdrop_main.c -o xdrop_main.elf

              echo "clang $CFLAGS -c xdrop_gate.c -o xdrop_gate.elf"
              clang $CFLAGS -c xdrop_gate.c -o xdrop_gate.elf

              echo "=== BPF objects built ==="
              ls -l *.elf
              for f in *.elf; do
                echo "--- $f ---"
                llvm-readelf -h "$f" | grep -E "Class|Machine|Type"
              done
            '

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: node/agent/go.sum

      - name: Build node agent
        working-directory: node/agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
          CGO_LDFLAGS: ${{ matrix.libc == 'musl' && '-static' || '' }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME:-dev} ${{ matrix.static_flags }}" \
            -o ../../dist/xdrop-agent-linux-${{ matrix.arch }}-${{ matrix.libc }} \
            .
          chmod +x ../../dist/xdrop-agent-linux-${{ matrix.arch }}-${{ matrix.libc }}

      - name: Verify linkage (musl static)
        if: matrix.libc == 'musl'
        run: |
          BIN=dist/xdrop-agent-linux-${{ matrix.arch }}-musl
          file "$BIN"
          if ldd "$BIN" 2>&1 | grep -q "not a dynamic executable"; then
            echo "OK: $BIN is statically linked"
          elif ldd "$BIN" 2>&1 | grep -qi "statically linked"; then
            echo "OK: $BIN is statically linked"
          else
            echo "ERROR: $BIN is NOT statically linked"
            ldd "$BIN" || true
            exit 1
          fi

      - name: Verify executable bit
        run: |
          if [ ! -x dist/xdrop-agent-linux-${{ matrix.arch }}-${{ matrix.libc }} ]; then
            echo "ERROR: binary is not executable"
            exit 1
          fi
          ls -l dist/xdrop-agent-linux-${{ matrix.arch }}-${{ matrix.libc }}

      - name: Package BPF artifacts
        run: |
          set -euo pipefail
          ARCH_DIR=${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}
          mkdir -p dist/bpf-${ARCH_DIR}
          cp node/bpf/*.elf dist/bpf-${ARCH_DIR}/
          ls -l dist/bpf-${ARCH_DIR}/

      - name: Upload agent binary
        uses: actions/upload-artifact@v4
        with:
          name: node-agent-${{ matrix.arch }}-${{ matrix.libc }}
          path: dist/xdrop-agent-linux-${{ matrix.arch }}-${{ matrix.libc }}
          if-no-files-found: error

      - name: Upload BPF objects
        if: matrix.libc == 'musl'
        uses: actions/upload-artifact@v4
        with:
          name: bpf-${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}
          path: dist/bpf-${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 3. Docker 镜像 — 多平台，推 ghcr.io
  # ─────────────────────────────────────────────────────────────
  docker:
    name: Docker (${{ matrix.image }})
    needs: [controller, node-agent]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: controller
          - image: node

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Restore executable bits
        run: |
          chmod +x artifacts/xdrop-controller-* 2>/dev/null || true
          chmod +x artifacts/xdrop-agent-* 2>/dev/null || true
          ls -l artifacts/ | head -20

      - name: Prepare docker context
        run: |
          set -euo pipefail
          mkdir -p docker-ctx/${{ matrix.image }}

          cp /etc/ssl/certs/ca-certificates.crt docker-ctx/${{ matrix.image }}/ca-certificates.crt

          if [ "${{ matrix.image }}" = "controller" ]; then
            cp artifacts/xdrop-controller-linux-amd64-musl \
               docker-ctx/controller/xdrop-controller-amd64
            cp artifacts/xdrop-controller-linux-arm64-musl \
               docker-ctx/controller/xdrop-controller-arm64
            cat > docker-ctx/controller/Dockerfile <<'EOF'
          FROM scratch
          ARG TARGETARCH
          COPY --chmod=0755 xdrop-controller-${TARGETARCH} /xdrop-controller
          COPY --chmod=0644 ca-certificates.crt /etc/ssl/certs/ca-certificates.crt
          EXPOSE 8000
          VOLUME ["/data"]
          ENTRYPOINT ["/xdrop-controller"]
          EOF
          else
            cp artifacts/xdrop-agent-linux-amd64-musl \
               docker-ctx/node/xdrop-agent-amd64
            cp artifacts/xdrop-agent-linux-arm64-musl \
               docker-ctx/node/xdrop-agent-arm64

            mkdir -p docker-ctx/node/amd64 docker-ctx/node/arm64
            cp artifacts/bpf-x86_64/xdrop_main.elf docker-ctx/node/amd64/
            cp artifacts/bpf-x86_64/xdrop_gate.elf docker-ctx/node/amd64/
            cp artifacts/bpf-arm64/xdrop_main.elf  docker-ctx/node/arm64/
            cp artifacts/bpf-arm64/xdrop_gate.elf  docker-ctx/node/arm64/

            cat > docker-ctx/node/Dockerfile <<'EOF'
          FROM scratch
          ARG TARGETARCH
          COPY --chmod=0755 xdrop-agent-${TARGETARCH} /xdrop-agent
          COPY --chmod=0644 ${TARGETARCH}/xdrop_main.elf /bpf/xdrop_main.elf
          COPY --chmod=0644 ${TARGETARCH}/xdrop_gate.elf /bpf/xdrop_gate.elf
          COPY --chmod=0644 ca-certificates.crt /etc/ssl/certs/ca-certificates.crt
          # 运行要求：
          #   --network host
          #   --cap-add=BPF,NET_ADMIN,PERFMON,SYS_RESOURCE
          #   -v /sys/fs/bpf:/sys/fs/bpf
          #   -v /sys/kernel/btf:/sys/kernel/btf:ro
          # 配置里 bpf.main_path/gate_path 指向 /bpf/*.elf
          ENTRYPOINT ["/xdrop-agent"]
          EOF
          fi

          echo "=== docker-ctx tree ==="
          find docker-ctx -type f -exec ls -l {} \;

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker-ctx/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

  # ─────────────────────────────────────────────────────────────
  # 4. 发布 Release
  # ─────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [controller, node-agent]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: find artifacts/ -type f -exec ls -lh {} \;

      - name: Generate checksums
        working-directory: artifacts
        run: |
          find . -type f ! -name 'checksums.txt' -exec sha256sum {} \; \
            | sed 's|\./||' | sort -k2 > checksums.txt
          cat checksums.txt

      - name: Compute release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          make_latest: ${{ steps.tag.outputs.make_latest }}
          files: |
            artifacts/xdrop-controller-linux-amd64-glibc
            artifacts/xdrop-controller-linux-amd64-musl
            artifacts/xdrop-controller-linux-arm64-glibc
            artifacts/xdrop-controller-linux-arm64-musl
            artifacts/xdrop-agent-linux-amd64-glibc
            artifacts/xdrop-agent-linux-amd64-musl
            artifacts/xdrop-agent-linux-arm64-glibc
            artifacts/xdrop-agent-linux-arm64-musl
            artifacts/bpf-x86_64/xdrop_main.elf
            artifacts/bpf-x86_64/xdrop_gate.elf
            artifacts/bpf-arm64/xdrop_main.elf
            artifacts/bpf-arm64/xdrop_gate.elf
            artifacts/checksums.txt
          fail_on_unmatched_files: false
