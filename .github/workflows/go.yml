name: Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write      # ← 推 ghcr.io 需要

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/xdrop

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Controller — 四象限二进制
  # ─────────────────────────────────────────────────────────────
  controller:
    name: Controller (${{ matrix.arch }}-${{ matrix.libc }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            libc: glibc
            runner: ubuntu-22.04
            cc: gcc
            static_flags: ''
          - arch: amd64
            goarch: amd64
            libc: musl
            runner: ubuntu-22.04
            cc: musl-gcc
            static_flags: "-linkmode external -extldflags '-static'"
          - arch: arm64
            goarch: arm64
            libc: glibc
            runner: ubuntu-22.04-arm
            cc: gcc
            static_flags: ''
          - arch: arm64
            goarch: arm64
            libc: musl
            runner: ubuntu-22.04-arm
            cc: musl-gcc
            static_flags: "-linkmode external -extldflags '-static'"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: controller/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: controller/web/package-lock.json

      - name: Install CGO build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev musl-tools

      - name: Build frontend
        working-directory: controller/web
        run: |
          npm ci
          npm run build

      - name: Build controller binary
        working-directory: controller
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
          CGO_LDFLAGS: ${{ matrix.libc == 'musl' && '-static' || '' }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME:-dev} ${{ matrix.static_flags }}" \
            -o ../dist/xdrop-controller-linux-${{ matrix.arch }}-${{ matrix.libc }} \
            ./cmd/controller

      - name: Verify linkage
        if: matrix.libc == 'musl'
        run: |
          file dist/xdrop-controller-linux-${{ matrix.arch }}-musl
          if ! file dist/xdrop-controller-linux-${{ matrix.arch }}-musl | grep -q "statically linked"; then
            echo "ERROR: musl build is not statically linked"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: controller-${{ matrix.arch }}-${{ matrix.libc }}
          path: dist/xdrop-controller-*
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 2. Node Agent — 四象限二进制 + BPF ELF
  # ─────────────────────────────────────────────────────────────
  node-agent:
    name: Node Agent (${{ matrix.arch }}-${{ matrix.libc }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            libc: glibc
            runner: ubuntu-22.04
            cc: gcc
            static_flags: ''
          - arch: amd64
            goarch: amd64
            libc: musl
            runner: ubuntu-22.04
            cc: musl-gcc
            static_flags: "-linkmode external -extldflags '-static'"
          - arch: arm64
            goarch: arm64
            libc: glibc
            runner: ubuntu-22.04-arm
            cc: gcc
            static_flags: ''
          - arch: arm64
            goarch: arm64
            libc: musl
            runner: ubuntu-22.04-arm
            cc: musl-gcc
            static_flags: "-linkmode external -extldflags '-static'"

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm make \
            linux-libc-dev libbpf-dev \
            libelf-dev zlib1g-dev \
            gcc musl-tools \
            linux-tools-common linux-tools-generic

      - name: Ensure bpftool works
        shell: bash
        run: |
          set -euo pipefail
          if /usr/sbin/bpftool -V >/dev/null 2>&1; then
            echo "bpftool works"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends linux-tools-generic
          KREL="$(uname -r)"
          FALLBACK="$(find /usr/lib -type f -name bpftool -perm -111 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$FALLBACK" ]; then
            echo "ERROR: no bpftool payload found"
            exit 1
          fi
          sudo mkdir -p "/usr/lib/linux-tools/${KREL}"
          sudo ln -sf "$FALLBACK" "/usr/lib/linux-tools/${KREL}/bpftool"
          /usr/sbin/bpftool -V

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: node/agent/go.sum

      - name: Generate vmlinux.h
        working-directory: node/bpf
        run: |
          if [ -f vmlinux.h ]; then
            echo "vmlinux.h already present, skip"
            exit 0
          fi
          if [ ! -f /sys/kernel/btf/vmlinux ]; then
            echo "ERROR: /sys/kernel/btf/vmlinux not found."
            exit 1
          fi
          sudo bpftool btf dump file /sys/kernel/btf/vmlinux format c > vmlinux.h
          head -5 vmlinux.h
          wc -l vmlinux.h

      - name: Build BPF objects
        working-directory: node
        env:
          CC: clang
          ARCH: ${{ matrix.arch == 'arm64' && 'arm64' || 'x86' }}
        run: make bpf

      - name: Build node agent
        working-directory: node/agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
          CGO_LDFLAGS: ${{ matrix.libc == 'musl' && '-static' || '' }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME:-dev} ${{ matrix.static_flags }}" \
            -o ../../dist/xdrop-agent-linux-${{ matrix.arch }}-${{ matrix.libc }} \
            .

      - name: Verify linkage
        if: matrix.libc == 'musl'
        run: |
          file dist/xdrop-agent-linux-${{ matrix.arch }}-musl
          if ! file dist/xdrop-agent-linux-${{ matrix.arch }}-musl | grep -q "statically linked"; then
            echo "ERROR: musl build is not statically linked"
            exit 1
          fi

      - name: Package artifacts
        run: |
          ARCH_DIR=${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}
          mkdir -p dist/bpf-${ARCH_DIR}
          cp node/bpf/*.elf dist/bpf-${ARCH_DIR}/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: node-agent-${{ matrix.arch }}-${{ matrix.libc }}
          path: dist/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 3. Docker 镜像 — 多平台，推 ghcr.io
  #    只用 musl 静态二进制，基础镜像用 scratch
  # ─────────────────────────────────────────────────────────────
  docker:
    name: Docker (${{ matrix.image }})
    needs: [controller, node-agent]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: controller
            title: XDrop Controller
          - image: node
            title: XDrop Node Agent

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Prepare docker context
        run: |
          mkdir -p docker-ctx/${{ matrix.image }}

          if [ "${{ matrix.image }}" = "controller" ]; then
            # 只用 musl 静态版
            cp artifacts/xdrop-controller-linux-amd64-musl \
               docker-ctx/controller/xdrop-controller-amd64
            cp artifacts/xdrop-controller-linux-arm64-musl \
               docker-ctx/controller/xdrop-controller-arm64
            cp controller/config.example.yaml \
               docker-ctx/controller/config.example.yaml
            cat > docker-ctx/controller/Dockerfile <<'EOF'
          FROM scratch
          ARG TARGETARCH
          COPY xdrop-controller-${TARGETARCH} /xdrop-controller
          COPY config.example.yaml /config.example.yaml
          EXPOSE 8000
          VOLUME ["/data"]
          ENTRYPOINT ["/xdrop-controller"]
          EOF
          else
            cp artifacts/xdrop-agent-linux-amd64-musl \
               docker-ctx/node/xdrop-agent-amd64
            cp artifacts/xdrop-agent-linux-arm64-musl \
               docker-ctx/node/xdrop-agent-arm64
            cp artifacts/bpf-x86_64/xdrop_gate.elf \
               docker-ctx/node/bpf_gate_x86_64.elf 2>/dev/null || true
            cp artifacts/bpf-x86_64/xdrop_main.elf \
               docker-ctx/node/bpf_main_x86_64.elf 2>/dev/null || true
            cp artifacts/bpf-arm64/xdrop_gate.elf \
               docker-ctx/node/bpf_gate_arm64.elf 2>/dev/null || true
            cp artifacts/bpf-arm64/xdrop_main.elf \
               docker-ctx/node/bpf_main_arm64.elf 2>/dev/null || true
            cp node/config.example.yaml \
               docker-ctx/node/config.example.yaml 2>/dev/null || true
            cat > docker-ctx/node/Dockerfile <<'EOF'
          FROM scratch
          ARG TARGETARCH
          COPY xdrop-agent-${TARGETARCH} /xdrop-agent
          COPY bpf_gate_*_${TARGETARCH}.elf /bpf/
          COPY bpf_main_*_${TARGETARCH}.elf /bpf/
          COPY config.example.yaml /config.example.yaml
          # Node Agent 需要：
          #   --network host          （XDP 要看到宿主机网卡）
          #   --cap-add=BPF,NET_ADMIN,PERFMON
          #   -v /sys/fs/bpf:/sys/fs/bpf
          #   -v /sys/kernel/btf:/sys/kernel/btf:ro
          ENTRYPOINT ["/xdrop-agent"]
          EOF
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker-ctx/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

  # ─────────────────────────────────────────────────────────────
  # 4. 发布 Release（latest）
  # ─────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [controller, node-agent]
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: find artifacts/ -type f -exec ls -lh {} \;

      - name: Generate checksums
        working-directory: artifacts
        run: |
          find . -type f ! -name 'checksums.txt' -exec sha256sum {} \; \
            | sed 's|\./||' | sort -k2 > checksums.txt
          cat checksums.txt

      - name: Compute release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            artifacts/xdrop-controller-*
            artifacts/xdrop-agent-*
            artifacts/bpf-*/**
            artifacts/checksums.txt
          fail_on_unmatched_files: false
